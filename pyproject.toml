[project]
name = "k8s-mcp"
version = "0.1.0"
description = "Read-only Kubernetes MCP server"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "kubernetes",
    # The server uses the mcp 2.x API.
    "mcp[cli]>=2,<3",
    "pyyaml",
    "starlette",
    "uvicorn",
]

[project.optional-dependencies]
# Test dependencies.
dev = [
    "pytest",
]
